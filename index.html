<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFD600" />
    <meta name="description" content="Contact card powered by Fast." />
    <title>Contact | Fast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="contact-card">
      <header class="card-header">
        <div class="brand-row">
          <span class="brand">fast<span class="brand-dot">.</span></span>
          <span class="brand-spark" aria-hidden="true">✦</span>
        </div>
        <img
          class="avatar"
          src="./img/1755367453669.jpeg"
          alt="Profile portrait"
          width="160"
          height="160"
        />
        <h1>Yoann L'hostis</h1>
        <p class="job-title">Frontend Developer</p>
      </header>

      <section class="card-content" aria-label="Contact information">
        <a class="contact-link" href="mailto:lhostis.yoann@gmail.com">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 7 8 6 8-6" />
            </svg>
          </span>
          <span class="contact-value">lhostis.yoann@gmail.com</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="contact-link" href="tel:+33678335896">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M7 3h3l1.5 4-2 2a15 15 0 0 0 5.5 5.5l2-2L21 14v3a4 4 0 0 1-4 4C9.3 21 3 14.7 3 7a4 4 0 0 1 4-4Z"
              />
            </svg>
          </span>
          <span class="contact-value">+33 6 78 33 58 96</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="cta"
          href="https://yoannlh.github.io/fast_landing/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Discover Fast <span aria-hidden="true">⚡</span>
        </a>
        <p class="footer">Made to share. <strong>Powered by Fast.</strong></p>
      </section>
    </main>
  </body>
</html>
